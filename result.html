<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Résumé Gemini</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 40px; line-height: 1.6; max-width: 800px; margin: auto; background: #f4f7f6; color: #333; }
    .container { background: white; padding: 40px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); }
    h1 { color: #0b57d0; border-bottom: 2px solid #eef2ff; padding-bottom: 15px; margin-top: 0; }
    #output { white-space: pre-wrap; font-size: 1.1em; }
    .loader { color: #666; font-style: italic; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Résumé de l'IA</h1>
    <div id="output" class="loader">Récupération du résumé en cours...</div>
  </div>

  <script>
    // Fonction pour lire le résumé
    function loadSummary() {
      chrome.storage.local.get('last_summary', (data) => {
        if (data.last_summary) {
          const output = document.getElementById('output');
          output.innerText = data.last_summary;
          output.classList.remove('loader');
        }
      });
    }

    // Charger immédiatement
    loadSummary();

    // Au cas où le stockage est un peu lent, on vérifie toutes les 500ms
    const interval = setInterval(() => {
      chrome.storage.local.get('last_summary', (data) => {
        if (data.last_summary && data.last_summary !== "Récupération du résumé en cours...") {
          document.getElementById('output').innerText = data.last_summary;
          document.getElementById('output').classList.remove('loader');
          clearInterval(interval);
        }
      });
    }, 500);
  </script>
</body>
</html>
